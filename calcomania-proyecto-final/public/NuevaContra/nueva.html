<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer Contraseña</title>
  <link rel="stylesheet" href="/calcomania-proyecto-final/public/NuevaContra/stylenueva.css">
  <link rel="icon" href="/calcomania-proyecto-final/public/Assets/Iconos/icono.png">
</head>
<body>
  <section>
    <div class="login-box">
      <h2>Restablecer Contraseña</h2>

      <form id="reset-form" novalidate>
        <!-- Nueva contraseña -->
        <div class="input-box">
          <span class="icon">
            <ion-icon name="lock-closed-outline"></ion-icon>
          </span>
          <input
            id="new-password"
            name="new_password"
            type="password"
            autocomplete="new-password"
            required
          >
          <label for="new-password">Nueva Contraseña</label>

          <!-- 👇 Toggle de visibilidad -->
          <span class="password-toggle" data-target="new-password">
            <ion-icon class="eye-on"  name="eye-outline"></ion-icon>
            <ion-icon class="eye-off" name="eye-off-outline"></ion-icon>
          </span>
        </div>

        <!-- Confirmar contraseña -->
        <div class="input-box">
          <span class="icon">
            <ion-icon name="lock-closed-outline"></ion-icon>
          </span>
          <input
            id="confirm-password"
            name="confirm_password"
            type="password"
            autocomplete="new-password"
            required
          >
          <label for="confirm-password">Confirmar Contraseña</label>

          <!-- 👇 Toggle de visibilidad -->
          <span class="password-toggle" data-target="confirm-password">
            <ion-icon class="eye-on"  name="eye-outline"></ion-icon>
            <ion-icon class="eye-off" name="eye-off-outline"></ion-icon>
          </span>
        </div>

        <button id="btn-new-contraseña" type="submit">Actualizar Contraseña</button>
      </form>

    </div>
  </section>

  <script type="module" src="/calcomania-proyecto-final/public/NuevaContra/js/main.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
